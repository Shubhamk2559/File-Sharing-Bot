<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin Panel</title>
<style>
  :root { color-scheme: dark; --bg:#0f141a; --surface:#171e26; --surface2:#1e2731; --ink:#e8eef3; --muted:#93a2b0; --line:#2b3641;

  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-variant-numeric:tabular-nums; }
  a { color:var(--accent); }
  button,input,select,textarea { font:inherit; color:inherit; }

  input[type=checkbox] { width:auto; }
  textarea { width:100%; min-height:90px; resize:vertical; }
  button { background:var(--accent); color:#0b1220; border:0; border-radius:6px; padding:7px 14px; font-weight:650; cursor:pointer; }
  button.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
  button.danger { background:var(--bad); color:#1a0b0b; }

  nav { background:var(--surface); border-right:1px solid var(--line); padding:14px 10px; position:sticky; top:0; height:100vh; overflow:auto; }

  nav button.on { background:var(--surface2); color:var(--accent); font-weight:650; }
  nav .foot { margin-top:14px; border-top:1px solid var(--line); padding-top:10px; }
  main { padding:18px; min-width:0; max-width:1150px; width:100%; }

  h2 { font-size:17px; margin:0 0 12px; } h3 { font-size:15px; margin:14px 0 8px; }
  .muted { color:var(--muted); font-size:13px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .stat { background:var(--surface2); border-radius:8px; padding:10px 12px; } .stat b { display:block; font-size:21px; } .stat span { color:var(--muted); font-size:12.5px; }
  .row { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; margin:8px 0; }
  .row label { display:flex; flex-direction:column; gap:3px; font-size:13px; color:var(--muted); }
  .tablewrap { overflow-x:auto; } table { border-collapse:collapse; width:100%; min-width:560px; }
  th,td { text-align:left; padding:7px 9px; border-bottom:1px solid var(--line); vertical-align:top; } th { color:var(--muted); font-size:12.5px; font-weight:600; white-space:nowrap; }
  .tag { display:inline-block; font-size:11.5px; padding:0 8px; border-radius:10px; border:1px solid var(--line); color:var(--muted); }
  .tag.ok { color:var(--ok); border-color:var(--ok); } .tag.bad { color:var(--bad); border-color:var(--bad); } .tag.warn { color:var(--warn); border-color:var(--warn); }
  .bar { height:8px; background:var(--surface2); border-radius:6px; overflow:hidden; } .bar i { display:block; height:100%; background:var(--accent); }
  .tabs { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 12px; } .tabs button { background:var(--surface2); color:var(--ink); font-weight:500; } .tabs button.on { background:var(--accent); color:#0b1220; }
  #toast { position:fixed; right:14px; bottom:14px; z-index:50; display:grid; gap:8px; max-width:min(420px,calc(100vw - 28px)); }
  #toast div { background:var(--surface2); border:1px solid var(--line); border-left:4px solid var(--ok); padding:9px 12px; border-radius:6px; word-break:break-word; } #toast div.err { border-left-color:var(--bad); }
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); display:grid; place-items:center; z-index:40; padding:14px; }
  .modal { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:18px; width:min(560px,100%); max-height:92vh; overflow:auto; }
  .logbox { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:8px; max-height:150px; overflow:auto; font:12px/1.4 ui-monospace,Menlo,monospace; white-space:pre-wrap; word-break:break-word; }
  pre.json { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:8px; overflow:auto; max-height:320px; font-size:12px; }
  .login { max-width:380px; margin:12vh auto; padding:0 14px; }

  @media (max-width:820px) {

</style>
